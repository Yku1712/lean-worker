name: Deploy Lean Worker Registry

on:
  push:
    branches: [ main ]
    paths:
      - 'minimal/lean_worker_registry.lean'
      - 'lean_worker_registry.lean'
      - 'tasks/lean4_mirrors/registry.yaml'
      - 'tasks/lean4_mirrors/zkp_references.json'
      - 'tasks/lean4_mirrors/generate_registry.py'
      - 'deploy.sh'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          
      - name: Build Lean4 registry
        run: |
          cd minimal
          python3 generate_registry.py
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: arist/lean-worker:latest
          file: Dockerfile
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: Push to Docker Hub
        run: |
          docker push arist/lean-worker:latest
          
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          api_token: ${{ secrets.CF_API_TOKEN }}
          account_id: ${{ secrets.CF_ACCOUNT_ID }}
          project: arist-p2p-thunk
          directory: .
          git_branch: main
          commit_hash: ${{ github.sha }}
        
      - name: Invalidate Cloudflare cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/cache/purge"
          -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}"
          -H "Content-Type: application/json"
          --data '{"purge": ["*"]}'